<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>OmniAtlas</title>
  <defs>
    <!-- The near half of the ring: the lower band, since the ring is tilted so we see
         it from slightly above. The same ellipse is drawn twice, in ONE colour, and the
         second copy is clipped to this band so it lands on top of the planet. That is
         what makes it read as a ring wrapping a world rather than a line through a dot.

         The two halves were briefly given different tones to suggest a shadow. They
         meet at the ansae, where the ring is edge-on and the two strokes are collinear,
         so any difference between them shows up there as a hard step in the middle of a
         continuous curve. It read as a rendering fault, which is what it was. -->
    <clipPath id="oa-near"><rect x="-4" y="16" width="40" height="20"/></clipPath>
    <!-- The lit hemisphere, from a star up and to the right. -->
    <mask id="oa-lit">
      <rect width="32" height="32" fill="#000"/>
      <circle cx="19.6" cy="12.8" r="8.5" fill="#fff"/>
    </mask>
  </defs>

  <rect width="32" height="32" rx="7" fill="#060c10"/>

  <!-- Far half, drawn before the planet so the planet occludes it. -->
  <g transform="rotate(-24 16 16)">
    <ellipse cx="16" cy="16" rx="12.2" ry="4.3" fill="none" stroke="#9ff0ff" stroke-width="1.9"/>
  </g>

  <circle cx="16" cy="16" r="6.3" fill="#13505f"/>
  <circle cx="16" cy="16" r="6.3" fill="#6fe2f4" mask="url(#oa-lit)"/>

  <!-- Near half, over the planet. Brighter than the lit limb on purpose: a ring the
       same value as the disc it crosses disappears exactly where it has to be read. -->
  <g clip-path="url(#oa-near)">
    <g transform="rotate(-24 16 16)">
      <ellipse cx="16" cy="16" rx="12.2" ry="4.3" fill="none" stroke="#9ff0ff" stroke-width="1.9"/>
    </g>
  </g>
</svg>
